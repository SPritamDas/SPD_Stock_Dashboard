name: nightly-refresh

# Runs the full data refresh once a day:
#   1. execute the (scrubbed) FII/DII notebook headless  -> refreshes the superstar Google Sheets
#   2. build the V-universe price/fundamentals cache       -> vivek_output/dashboard_cache.pkl
#   3. publish that cache as a single, overwritten GitHub Release asset (no git-history bloat)
on:
  schedule:
    - cron: "30 11 * * *"   # 17:00 IST (5 PM, after NSE close) = 11:30 UTC
  workflow_dispatch: {}      # lets you trigger it manually from the Actions tab

permissions:
  contents: write            # needed to create/update the Release asset

concurrency:                 # never let two nightly runs overlap
  group: nightly-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180       # the Trendlyne scrape is slow + self-throttled
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-ci.txt

      - name: Refresh FII/DII superstar sheets (run notebook headless)
        continue-on-error: true   # Trendlyne may rate-limit CI IPs; skip-on-failure keeps yesterday's data
        env:
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: |
          jupyter nbconvert --to notebook --execute fii_dii_investment_pattern.ipynb \
            --output /tmp/executed.ipynb --ExecutePreprocessor.timeout=-1

      - name: Build the V-universe cache (prices + fundamentals)
        env:
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: python refresh.py

      - name: Publish cache as the 'data-latest' Release asset (overwrite)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view data-latest >/dev/null 2>&1 || \
            gh release create data-latest --title "Latest data cache" --notes "auto-updated"
          gh release upload data-latest vivek_output/dashboard_cache.pkl --clobber
