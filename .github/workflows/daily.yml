name: nightly-refresh

# FULLY AUTOMATED daily refresh — runs entirely in the cloud (no local machine needed):
#   1. execute the FII/DII notebook headless -> refreshes ALL the superstar Google-Sheet tabs
#   2. build the V-universe price/fundamentals cache -> vivek_output/dashboard_cache.pkl
#   3. publish that cache as a single, overwritten GitHub Release asset (the deployed app pulls it)
#
# SCRAPING FROM THE CLOUD: NSE (and Trendlyne to a lesser degree) block GitHub's datacenter IPs.
#   • WITHOUT a proxy: yfinance data (prices/cache/index) + investorgain IPO refresh fine; the
#     NSE deal feeds (bulk/block · SAST · insider · market-wide) may not refresh — they're block-safe
#     (last-good preserved, no crash).
#   • WITH a proxy: add a repo secret  SCRAPE_PROXY = http://user:pass@host:port  (any residential/
#     rotating proxy) and ALL scraping routes through it → NSE/Trendlyne work from the cloud, laptop
#     off. Data volume is tiny (~tens of MB/day). No code change needed to switch it on.
on:
  schedule:
    - cron: "0 15 * * *"     # 20:30 IST (8:30 PM, after NSE posts its EOD deals) = 15:00 UTC.
                             # NOTE: GitHub cron can start 5–30+ min late; the run takes ~45–75 min,
                             # so it should finish before a 10 PM IST check. Move earlier for more buffer.
  workflow_dispatch: {}      # lets you trigger it manually from the Actions tab

permissions:
  contents: write            # needed to create/update the Release asset

concurrency:                 # never let two nightly runs overlap
  group: nightly-refresh
  cancel-in-progress: true   # a fresh nightly SUPERSEDES a lingering/stuck one (the build is idempotent).
                             # (Was false → queued runs got auto-cancelled, silently skipping a night: runs #35/#36.)

jobs:
  refresh:
    runs-on: ubuntu-latest
    # 90 was NOT enough headroom. A typical run is ~75 min total, but refresh.py's own wall-clock
    # backstops (which exist so a hung yfinance socket can't wedge the build) permit far longer:
    # prices ~55 min + retries ~11 + a FULL fundamentals refresh ~88 + its retries ~19. On a slow
    # night the job hit the 90-min ceiling and was killed BEFORE the publish step — so the cache was
    # built and then thrown away. 210 covers even the worst case; a run still cannot bleed into the
    # next night (24 h apart), and `concurrency.cancel-in-progress` supersedes a lingering run anyway.
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-ci.txt

      - name: Refresh FII/DII superstar sheets (run notebook headless)
        continue-on-error: true   # keep going to the cache build + publish even if a scrape source is
                                  # blocked/errors — the feeds are block-safe (last-good preserved), and
                                  # --allow-errors means the notebook won't abort on one bad cell.
        timeout-minutes: 45       # cap a blocked/hung scrape so refresh.py + the cache publish still run
        env:
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          # OPTIONAL residential-proxy switch (see header). Unset = scrape direct from the datacenter IP.
          SCRAPE_PROXY: ${{ secrets.SCRAPE_PROXY }}
        run: |
          if [ -n "${SCRAPE_PROXY}" ]; then
            export HTTPS_PROXY="$SCRAPE_PROXY" HTTP_PROXY="$SCRAPE_PROXY"
            # keep Google Sheets auth + GitHub off the proxy (no need; saves proxy bandwidth)
            export NO_PROXY="googleapis.com,google.com,oauth2.googleapis.com,github.com,githubusercontent.com"
            echo "::notice::Scraping via residential proxy (SCRAPE_PROXY is set)."
          else
            echo "::notice::No SCRAPE_PROXY secret — scraping direct from the datacenter IP; NSE/Trendlyne deal feeds may not refresh (block-safe)."
          fi
          jupyter nbconvert --to notebook --execute fii_dii_investment_pattern.ipynb \
            --output /tmp/executed.ipynb \
            --ExecutePreprocessor.timeout=1200 \
            --ExecutePreprocessor.interrupt_on_timeout=True \
            --allow-errors
          # concise per-cell summary into the Actions log (what wrote / ALERTed / errored)
          python nb_summary.py /tmp/executed.ipynb

      - name: Build the V-universe cache (prices + fundamentals)
        # Reads the V-universe LIVE from the `stock_classifications` tab first, so sheet edits apply
        # to this run. Fundamentals are incremental (carried forward, full refresh weekly) to stay
        # under Yahoo's rate limit — see the FUND_* constants in refresh.py.
        timeout-minutes: 150
        env:
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: python refresh.py

      - name: Publish cache as the 'data-latest' Release asset (overwrite)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view data-latest >/dev/null 2>&1 || \
            gh release create data-latest --title "Latest data cache" --notes "auto-updated"
          gh release upload data-latest vivek_output/dashboard_cache.pkl --clobber
